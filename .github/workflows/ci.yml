name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ordivia/domain test
      - name: Test di sicurezza del database
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql > /dev/null
          ./scripts/db-test.sh
      - name: Build
        run: pnpm --filter @ordivia/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only
